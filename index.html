<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b0c10"><title>Marvel vs DC — The 10K Vote</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% -10%,#252a35,#101217 44%,#090a0d);color:#fff;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}main{width:min(760px,92vw);margin:auto;padding:56px 0}.card{background:#13151beF;border:1px solid #2e323a;border-radius:28px;padding:28px;box-shadow:0 24px 80px #0008}.eyebrow{text-align:center;color:#9fa6b2;font-weight:800;letter-spacing:.12em;font-size:12px;text-transform:uppercase}h1{text-align:center;font-size:clamp(34px,8vw,58px);line-height:1;margin:10px 0}.sub{text-align:center;color:#b8bec8;font-size:17px;margin-bottom:30px}.votes{display:grid;grid-template-columns:1fr 1fr;gap:14px}button{font:inherit;border:0;border-radius:20px;padding:22px 12px;background:#fff;color:#0b0c10;font-weight:900;font-size:22px;cursor:pointer;transition:.16s}button:hover{filter:brightness(.95);transform:translateY(-2px)}button:disabled{opacity:.55;cursor:default;transform:none}.results{margin-top:34px}.row{margin:18px 0}.head{display:flex;justify-content:space-between;margin-bottom:8px;font-weight:800}.track{height:18px;background:#2b2f36;border-radius:999px;overflow:hidden}.fill{height:100%;width:0;background:#fff;border-radius:999px;transition:width .4s}.status{text-align:center;min-height:26px;margin-top:22px;color:#b8bec8}.total{text-align:center;margin-top:8px;color:#858d99;font-size:14px}.note{text-align:center;margin-top:24px;color:#68717f;font-size:12px}@media(max-width:560px){.votes{grid-template-columns:1fr}.card{padding:22px}}</style></head><body><main><section class="card"><div class="eyebrow">Community vote</div><h1>What is better?</h1><div class="sub">🦸 MARVEL vs 🦇 DC</div><div class="votes"><button id="marvel">🦸 MARVEL</button><button id="dc">🦇 DC</button></div><div class="results" aria-live="polite"><div class="row"><div class="head"><span>MARVEL</span><span id="mp">0%</span></div><div class="track"><div id="mb" class="fill"></div></div></div><div class="row"><div class="head"><span>DC</span><span id="dp">0%</span></div><div class="track"><div id="db" class="fill"></div></div></div></div><div id="status" class="status">Loading results…</div><div id="total" class="total">0 votes</div><div class="note">10K goal • One vote per browser token.</div></section></main><script>
const API_URL="https://wjryppqwzkfhuhprqurn.supabase.co/functions/v1/vote";
const token=localStorage.getItem("mvsdc_token")||crypto.randomUUID();localStorage.setItem("mvsdc_token",token);
const $=id=>document.getElementById(id),mB=$("marvel"),dB=$("dc");
function render(x){const m=+x.marvel||0,d=+x.dc||0,t=m+d,p=t?Math.round(m/t*100):0;$("mp").textContent=p+"%";$("dp").textContent=(100-p)+"%";$("mb").style.width=p+"%";$("db").style.width=(100-p)+"%";$("total").textContent=t.toLocaleString()+" vote"+(t===1?"":"s")}
async function refresh(){try{const r=await fetch(API_URL);const x=await r.json();if(!r.ok)throw Error();render(x);$("status").textContent="Choose your side."}catch{$("status").textContent="Results are temporarily unavailable."}}
async function vote(choice){mB.disabled=dB.disabled=true;$("status").textContent="Recording your vote…";try{const r=await fetch(API_URL,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({choice,token})});const x=await r.json();if(!r.ok)throw Error(x.error||"Vote failed");render(x);$("status").textContent="✅ Vote recorded!"}catch(e){$("status").textContent=e.message;mB.disabled=dB.disabled=false}}
mB.onclick=()=>vote("Marvel");dB.onclick=()=>vote("DC");refresh();
</script></body></html>
