<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0b0c10">
<title>Marvel vs DC — The 10K Vote</title>
<style>
:root{color-scheme:dark;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% -10%,#252a35 0,#101217 44%,#090a0d 100%);color:#fff}
main{width:min(760px,92vw);margin:auto;padding:56px 0 42px}
.card{background:rgba(19,21,27,.92);border:1px solid #2e323a;border-radius:28px;padding:28px;box-shadow:0 24px 80px rgba(0,0,0,.45);backdrop-filter:blur(12px)}
.eyebrow{text-align:center;color:#9fa6b2;font-weight:800;letter-spacing:.12em;font-size:12px;text-transform:uppercase}
h1{text-align:center;font-size:clamp(34px,8vw,58px);line-height:1;margin:10px 0 10px}
.subtitle{text-align:center;color:#b8bec8;font-size:17px;margin-bottom:30px}
.votes{display:grid;grid-template-columns:1fr 1fr;gap:14px}
button{font:inherit;border:0;border-radius:20px;padding:22px 12px;background:#fff;color:#0b0c10;font-weight:900;font-size:22px;cursor:pointer;transition:transform .16s,filter .16s,box-shadow .16s}
button:hover{filter:brightness(.95);box-shadow:0 10px 30px rgba(255,255,255,.09);transform:translateY(-2px)}
button:active{transform:translateY(0) scale(.985)}
button[disabled]{opacity:.55;cursor:default;transform:none;box-shadow:none}
.results{margin-top:34px}
.row{margin:18px 0}
.rowhead{display:flex;justify-content:space-between;gap:20px;margin-bottom:8px;font-weight:800}
.track{height:18px;background:#2b2f36;border-radius:999px;overflow:hidden}
.fill{height:100%;width:0;background:#fff;border-radius:999px;transition:width .4s ease}
.status{text-align:center;min-height:26px;margin-top:22px;color:#b8bec8}
.total{text-align:center;margin-top:8px;color:#858d99;font-size:14px}
.note{text-align:center;margin-top:24px;color:#68717f;font-size:12px;line-height:1.5}
.success{color:#fff}
@media(max-width:560px){.votes{grid-template-columns:1fr}.card{padding:22px}}
</style>
</head>
<body>
<main>
<section class="card">
<div class="eyebrow">Community vote</div>
<h1>What is better?</h1>
<div class="subtitle">🦸 MARVEL vs 🦇 DC</div>

<div class="votes">
<button id="marvel">🦸 MARVEL</button>
<button id="dc">🦇 DC</button>
</div>

<div class="results" aria-live="polite">
<div class="row">
<div class="rowhead"><span>MARVEL</span><span id="mp">0%</span></div>
<div class="track"><div id="mb" class="fill"></div></div>
</div>
<div class="row">
<div class="rowhead"><span>DC</span><span id="dp">0%</span></div>
<div class="track"><div id="db" class="fill"></div></div>
</div>
</div>

<div id="status" class="status">Loading results…</div>
<div id="total" class="total">0 votes</div>
<div class="note">10K goal • Results update after each vote.</div>
</section>
</main>
<script>
const API_URL = "REPLACE_WITH_SUPABASE_FUNCTION_URL";
const params = new URLSearchParams(location.search);
const token = params.get("token") || localStorage.getItem("poll_test_token") || crypto.randomUUID();
localStorage.setItem("poll_test_token", token);

const marvelBtn=document.getElementById("marvel");
const dcBtn=document.getElementById("dc");
const mp=document.getElementById("mp"),dp=document.getElementById("dp");
const mb=document.getElementById("mb"),db=document.getElementById("db");
const status=document.getElementById("status"),total=document.getElementById("total");

function render(data){
 const marvel=Number(data?.marvel||0), dc=Number(data?.dc||0), totalVotes=marvel+dc;
 const m=totalVotes?Math.round(marvel/totalVotes*100):0, d=100-m;
 mp.textContent=m+"%"; dp.textContent=d+"%";
 mb.style.width=m+"%"; db.style.width=d+"%";
 total.textContent=totalVotes.toLocaleString()+" vote"+(totalVotes===1?"":"s");
}
async function refresh(){
 if(API_URL.includes("REPLACE_WITH")){render({marvel:0,dc:0});status.textContent="Test page ready — backend is being connected.";return}
 try{
  const res=await fetch(API_URL,{method:"GET"});
  const data=await res.json(); if(!res.ok) throw new Error(data.error||"Unable to load results");
  render(data); status.textContent="Choose your side.";
 }catch(e){status.textContent="Results are temporarily unavailable.";console.error(e)}
}
async function vote(choice){
 if(API_URL.includes("REPLACE_WITH")){status.textContent="Backend setup is still in progress.";return}
 marvelBtn.disabled=true;dcBtn.disabled=true;status.textContent="Recording your vote…";
 try{
  const res=await fetch(API_URL,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({choice,token})});
  const data=await res.json(); if(!res.ok) throw new Error(data.error||"Vote failed");
  render(data); status.textContent="✅ Vote recorded!"; status.classList.add("success");
 }catch(e){status.textContent=e.message||"Vote failed.";marvelBtn.disabled=false;dcBtn.disabled=false}
}
marvelBtn.addEventListener("click",()=>vote("Marvel"));
dcBtn.addEventListener("click",()=>vote("DC"));
refresh();
</script>
</body>
</html>
